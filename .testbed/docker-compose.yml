# UserReminder install test bed: Joomla 4 / 5 / 6, unattended, package served from /pkg.

x-joomla-env: &joomla-env
  JOOMLA_DB_USER: joomla
  JOOMLA_DB_PASSWORD: joomla
  JOOMLA_DB_NAME: joomla
  JOOMLA_DB_TYPE: mysqli
  JOOMLA_SITE_NAME: UserReminder Install Test
  JOOMLA_ADMIN_USER: Test Admin
  JOOMLA_ADMIN_USERNAME: admin
  JOOMLA_ADMIN_PASSWORD: system123zz@@
  JOOMLA_ADMIN_EMAIL: support@joomcoder.com
  JOOMLA_INSTALLATION_DISABLE_LOCALHOST_CHECK: "1"

x-mysql-env: &mysql-env
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: joomla
  MYSQL_USER: joomla
  MYSQL_PASSWORD: joomla

x-db-health: &db-health
  test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent || mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"]
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 20s

services:
  # ---------------- Mailpit (SMTP catcher: UI/API on :8025, SMTP on :1025) ----
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  # ---------------- Joomla 4.4 + MySQL 8.0 ----------------
  db-j4:
    image: mysql:8.0
    environment: *mysql-env
    healthcheck: *db-health
  joomla-j4:
    image: joomla:4.4-php8.2-apache
    depends_on: {db-j4: {condition: service_healthy}}
    environment:
      <<: *joomla-env
      JOOMLA_DB_HOST: db-j4
      JOOMLA_DB_PREFIX: j4_
    ports: ["8811:80"]
    volumes: ["pkg:/pkg:ro", "./e2e:/e2e:ro"]

  # ---------------- Joomla 5 + MySQL 8.0 ----------------
  db-j5:
    image: mysql:8.0
    environment: *mysql-env
    healthcheck: *db-health
  joomla-j5:
    image: joomla:5-php8.3-apache
    depends_on: {db-j5: {condition: service_healthy}}
    environment:
      <<: *joomla-env
      JOOMLA_DB_HOST: db-j5
      JOOMLA_DB_PREFIX: j5_
    ports: ["8812:80"]
    volumes: ["pkg:/pkg:ro", "./e2e:/e2e:ro"]

  # ---------------- Joomla 6.1.3 + MariaDB 11.5 ----------------
  db-j6:
    image: mariadb:11.5
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: joomla
      MARIADB_USER: joomla
      MARIADB_PASSWORD: joomla
    healthcheck: *db-health
  joomla-j6:
    image: joomla:6.1.3-php8.4-apache
    depends_on: {db-j6: {condition: service_healthy}}
    environment:
      <<: *joomla-env
      JOOMLA_DB_HOST: db-j6
      JOOMLA_DB_PREFIX: j6_
    ports: ["8813:80"]
    volumes: ["pkg:/pkg:ro", "./e2e:/e2e:ro"]

volumes:
  pkg:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: C:/wamp64/www/UserReminder/releases
