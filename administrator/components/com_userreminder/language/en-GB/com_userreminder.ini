USERREMINDER_SEND_MSG_REMINDER="Hello {NAME},\n\nyou registered an account at {SITENAME} but it has not been activated yet.\n\nPlease activate your account using the link below:\n{ACTIVATE_URL}\n\nIf you did not register on {SITENAME}, you can ignore this email.\n\nRegards,\n{SITENAME}\n{SITELINK}\n\nDo not want to receive these reminders? Opt out: {OPTOUT_URL}"
USERREMINDER_SEND_MSG_LOGINREMINDER="Hello {NAME},\n\nyour account at {SITENAME} has been activated, but you have never logged in.\n\nLog in now: {SITELINK}\nForgot your password? {PASSWORD_RESET_URL}\n\nRegards,\n{SITENAME}\n{SITELINK}\n\nDo not want to receive these reminders? Opt out: {OPTOUT_URL}"
USERREMINDER_SEND_MSG_EXISTINGUSERREMINDER="Hello {NAME},\n\nyou have not visited {SITENAME} for a while and we miss you.\n\nCome back and see what is new: {SITELINK}\n\nRegards,\n{SITENAME}\n{SITELINK}\n\nDo not want to receive these reminders? Opt out: {OPTOUT_URL}"

